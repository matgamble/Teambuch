<!doctype html><html><head><meta charset="utf-8"><style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 1080px; height: 1920px;
  font-family: Arial, sans-serif;
  background:
    linear-gradient(160deg, #f3efe6 0%, #f3efe6 45%, #ece0c9 100%);
  position: relative;
  overflow: hidden;
}
.dot-texture {
  position: absolute; inset: 0;
  background-image: radial-gradient(rgba(18,38,74,0.10) 3px, transparent 3px);
  background-size: 46px 46px;
  opacity: 0.6;
}
.content {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 90px;
}
.label {
  color: #c58b2b;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  font-size: 32px;
  margin-bottom: 26px;
}
.wordmark {
  font-family: Georgia, serif;
  font-style: italic;
  font-weight: 700;
  color: #12264a;
  font-size: 128px;
  line-height: 1.05;
  margin: 0 0 56px;
}
.orka-wrap {
  width: 460px;
  margin-bottom: 56px;
}
.orka-wrap img { width: 100%; display: block; filter: drop-shadow(0 18px 26px rgba(18,38,74,0.28)); }
.subtitle {
  color: #17284a;
  font-size: 44px;
  line-height: 1.5;
  max-width: 780px;
  margin-bottom: 70px;
}
.link-pill {
  display: inline-flex;
  align-items: center;
  gap: 18px;
  background: #12264a;
  color: #f8f4e9;
  font-size: 38px;
  font-weight: 700;
  padding: 26px 46px;
  border-radius: 60px;
  box-shadow: 0 14px 30px rgba(18,38,74,0.3);
}
.footer-motto {
  position: absolute;
  bottom: 90px;
  left: 0; right: 0;
  text-align: center;
  color: #7b6a4a;
  font-style: italic;
  font-size: 30px;
}
</style></head>
<body>
<div class="dot-texture"></div>
<div class="content">
  <p class="label">Kita Reischlestraße</p>
  <h1 class="wordmark">Teambuch</h1>
  <div class="orka-wrap"><img src="file:///home/user/Teambuch/site/orka-symbol.png"></div>
  <p class="subtitle">Unser digitales Teambuch – Stammgruppen, Lernwerkstätten, Fortbildungen und mehr, immer aktuell.</p>
  <div class="link-pill">🔗 matgamble.github.io/Teambuch</div>
</div>
<p class="footer-motto">Gemeinsam. Für Kinder. Mit Herz und Ideen.</p>
</body></html>
